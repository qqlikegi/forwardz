<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <title>ForwardZ</title>
    <script>
      // 防止主题闪烁：在首屏渲染前同步应用用户已选主题（obsidian / ceramic / amber）
      (function() {
        var VALID = { obsidian: true, ceramic: true, amber: true };
        var saved = null;
        try {
          saved = localStorage.getItem('fz_ui_theme');
        } catch (e) {}

        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (saved && VALID[saved]) ? saved : (prefersDark ? 'obsidian' : 'ceramic');
        var isDark = theme !== 'ceramic';

        var root = document.documentElement;
        root.setAttribute('data-fz-theme', theme);
        if (isDark) {
          root.classList.add('dark');
          root.style.colorScheme = 'dark';
        } else {
          root.classList.remove('dark');
          root.style.colorScheme = 'light';
        }

        // 检测H5模式并设置标记，避免布局切换时的闪屏
        var isMobile = window.innerWidth <= 768;
        var isMobileBrowser = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        var urlParams = new URLSearchParams(window.location.search);
        var isH5Param = urlParams.get('h5') === 'true';

        if (isMobile || isMobileBrowser || isH5Param) {
          root.classList.add('h5-mode');
        } else {
          root.classList.add('pc-mode');
        }
      })();
    </script>
    <style>
      /* 首屏防闪烁底色，与三套主题精确对齐 */
      :root {
        --toaster-bg: #ffffff;
        --toaster-color: #18181b;
        --toaster-border: #e4e4de;
      }

      html[data-fz-theme="obsidian"] body {
        background-color: #0a0b0f;
        color: #eef0f4;
      }

      html[data-fz-theme="ceramic"] body {
        background-color: #f6f6f3;
        color: #18181b;
      }

      html[data-fz-theme="amber"] body {
        background-color: #0d0e11;
        color: #f3f4f6;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #f6f6f3;
        color: #18181b;
        transition: background-color 0.25s ease, color 0.2s ease;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }

      html.dark body {
        background-color: #0a0b0f;
        color: #eef0f4;
      }

      #root {
        min-height: 100vh;
        background-color: transparent;
        overscroll-behavior: none;
      }

      @supports (height: 100dvh) {
        #root { min-height: 100dvh; }
      }

      @supports (-webkit-touch-callout: none) {
        #root { min-height: -webkit-fill-available; }
      }

      * {
        box-sizing: border-box;
      }

      html {
        transition: color-scheme 0.2s ease;
        overscroll-behavior: none;
      }

      .h5-mode #root,
      .pc-mode #root {
        background-color: transparent;
      }

      @media (max-width: 768px) {
        html, body {
          overscroll-behavior: none;
          -webkit-overflow-scrolling: touch;
        }
        .fixed {
          overscroll-behavior: none;
        }
      }
    </style>
    <meta key="title" content="ForwardZ" property="og:title" />
    <meta content="ForwardZ" property="og:description" />
    <meta content="ForwardZ" name="description" />
    <meta
      key="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, user-scalable=no"
      name="viewport"
    />
    <link href="/favicon.ico" rel="icon" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
